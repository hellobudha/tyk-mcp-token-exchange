---
# Trace backend for the demo. Jaeger all-in-one speaks OTLP natively, so no
# separate collector is needed: the gateway exports over gRPC (4317) and the
# chat over HTTP (4318), and both land in one trace.
#
# In-memory storage — traces are lost on restart, which is right for a demo and
# wrong for anything else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: acme
  labels: { app: jaeger }
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
            - { name: SPAN_STORAGE_TYPE, value: memory }
            - { name: MEMORY_MAX_TRACES, value: "20000" }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: acme
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: ui,        port: 16686, targetPort: 16686 }
